<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: 'Hind Siliguri', system-ui, sans-serif;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --bg: #eef0f3;
    --card: #fff;
    --border: #e3e6eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body {
    background: var(--bg);
    min-height: 100vh;
    padding: 48px 20px;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 32px;
    font-size: 15px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    background: var(--card);
    padding: 22px;
    border-radius: 10px;
    border: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    border-color: #c9d1db;
  }
  .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .card p { font-size: 14px; color: var(--muted); line-height: 1.45; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Services</h1>
  <p class="sub">Collection of independent, hosted utility tools.</p>
  <div class="grid">
    <a class="card" href="voucher/">
      <h2>Site Voucher</h2>
      <p>Site Voucher Generator</p>
    </a>
  </div>
</div>
</body>
</html>
