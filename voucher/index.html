<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>সাইট ভাউচার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --font: 'Noto Sans Bengali', 'Hind Siliguri', system-ui, sans-serif;
    --font-num: 'Noto Sans Bengali', 'Hind Siliguri', system-ui, sans-serif;
    --red: #c62828;
    --blue: #1a4ba0;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #bdbdbd;
    --line-soft: #e0e0e0;

    --fs-xs: 13px;
    --fs-sm: 14px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;
    --fs-xl: 34px;

    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1, "liga" 1;
  }

  body {
    background: #eef0f3;
    padding: 24px 16px;
    min-height: 100vh;
    font-size: var(--fs-base);
    line-height: 1.5;
  }

  input, button {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .controls {
    max-width: 820px;
    margin: 20px auto 0;
    background: #fff;
    padding: 14px 18px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls label { font-weight: var(--fw-semibold); font-size: var(--fs-sm); color: var(--ink); }
  .controls input[type="file"] { font-size: var(--fs-sm); }
  .controls button {
    padding: 9px 20px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: var(--fw-semibold);
    font-size: var(--fs-sm);
    letter-spacing: 0.2px;
  }
  .controls button:hover { background: #a91d1d; }
  .controls button.secondary { background: #424242; }
  .controls button.secondary:hover { background: #2a2a2a; }

  .voucher {
    width: 820px;
    margin: 0 auto;
    background: #fff;
    padding: 28px 56px 32px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    color: var(--ink);
    font-size: var(--fs-base);
  }

  /* Header */
  .header { text-align: center; }
  .bismillah { font-size: var(--fs-base); font-weight: var(--fw-medium); margin-bottom: 2px; }
  .company-name {
    color: var(--red);
    font-size: var(--fs-xl);
    font-weight: var(--fw-bold);
    letter-spacing: 0.5px;
    line-height: 1.15;
    margin: 0 0 4px;
  }
  .proprietor {
    display: inline-block;
    border: 1.5px solid var(--red);
    border-radius: 999px;
    padding: 3px 22px;
    font-size: var(--fs-base);
    font-weight: var(--fw-medium);
    margin: 2px 0 4px;
  }
  .mobile { font-size: var(--fs-base); font-weight: var(--fw-medium); margin-top: 2px; }
  .role-wrap {
    text-align: center;
    margin-top: 6px;
    color: var(--red);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    line-height: 1.3;
  }
  .role, input.role {
    display: inline-block;
    text-align: center;
    min-width: 180px;
  }
  .role-underline {
    display: block;
    height: 2px;
    background: var(--red);
    margin: 4px auto 0;
    width: 0;
  }
  .desc {
    font-size: var(--fs-sm);
    font-weight: var(--fw-regular);
    margin-top: 6px;
    color: var(--ink);
    line-height: 1.45;
  }
  .desc-input {
    width: 100%;
    text-align: center;
    color: var(--ink);
    font-size: var(--fs-sm);
    font-weight: var(--fw-regular);
  }
  .address {
    color: var(--blue);
    font-size: var(--fs-base);
    font-weight: var(--fw-semibold);
    margin-top: 2px;
  }

  .divider {
    border: none;
    border-top: 1.5px solid #333;
    margin: 12px 0;
  }

  /* Meta */
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: var(--fs-base);
    margin-bottom: 14px;
  }
  .meta-row .label { color: var(--muted); margin-right: 8px; font-weight: var(--fw-medium); }
  .label-input {
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: var(--fs-base);
    font-weight: var(--fw-medium);
    color: var(--muted);
    outline: none;
    padding: 0;
    margin-right: 4px;
    min-width: 30px;
  }
  .label-input:focus { color: var(--ink); }
  .site-label-input {
    color: var(--red);
    font-weight: var(--fw-bold);
    font-size: var(--fs-md);
    min-width: 40px;
  }
  .lbl-input {
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: var(--fs-md);
    font-weight: var(--fw-medium);
    color: var(--ink);
    outline: none;
    padding: 0;
    text-align: right;
    min-width: 40px;
  }
  .total-row .lbl-input { font-weight: var(--fw-semibold); }
  .meta-row input:not(.label-input) {
    border: none;
    border-bottom: 1px dashed var(--line-soft);
    font-family: var(--font-num);
    font-size: var(--fs-base);
    font-variant-numeric: tabular-nums;
    background: transparent;
    outline: none;
    min-width: 60px;
    color: var(--ink);
    padding: 2px 0;
  }
  .meta-row input:not(.label-input):focus { border-bottom-color: var(--muted); }
  .meta-row .left { display: flex; align-items: baseline; gap: 0; }
  .meta-row .right { display: flex; align-items: baseline; gap: 0; }
  .meta-row #sutro { min-width: 170px; }

  .site-code-row {
    margin-bottom: 24px;
    font-size: var(--fs-md);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .site-code-row .label {
    color: var(--red);
    font-weight: var(--fw-bold);
  }
  .site-code-row input:not(.label-input) {
    border: none;
    border-bottom: 1px dashed var(--line-soft);
    font-family: var(--font-num);
    font-size: var(--fs-md);
    font-weight: var(--fw-semibold);
    font-variant-numeric: tabular-nums;
    background: transparent;
    outline: none;
    min-width: 80px;
    color: var(--ink);
    padding: 2px 0;
    letter-spacing: 0.5px;
  }
  .site-code-row input:not(.label-input):focus { border-bottom-color: var(--muted); }

  /* Amounts */
  .amounts {
    display: flex;
    justify-content: center;
    margin: 16px 0 12px;
  }
  .amounts table {
    border-collapse: collapse;
    font-size: var(--fs-md);
  }
  .amounts td {
    padding: 5px 16px;
    vertical-align: middle;
  }
  .amounts td.lbl {
    text-align: right;
    font-weight: var(--fw-medium);
    color: var(--ink);
  }
  .amounts td.val {
    text-align: right;
    min-width: 150px;
  }
  .amounts input {
    border: none;
    border-bottom: 1px dashed transparent;
    background: transparent;
    font-family: var(--font-num);
    font-size: var(--fs-md);
    font-weight: var(--fw-medium);
    font-variant-numeric: tabular-nums;
    text-align: right;
    width: 140px;
    outline: none;
    color: var(--ink);
    padding: 2px 0;
    letter-spacing: 0.3px;
  }
  .amounts input:focus { border-bottom-color: var(--muted); }
  .amounts tr.total-row td {
    border-top: 1.5px solid #000;
    padding-top: 8px;
    font-weight: var(--fw-semibold);
  }
  .amounts tr.total-row input { font-weight: var(--fw-semibold); }

  /* Header inputs (editable text inside header) */
  input.hdr-input {
    border: none;
    border-bottom: 1px dashed transparent;
    background: transparent;
    text-align: center;
    outline: none;
    color: inherit;
    font-family: inherit;
    font-weight: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    padding: 0;
  }
  input.hdr-input:focus { border-bottom-color: var(--muted); }
  input.company-input {
    width: 100%;
    max-width: 620px;
    color: var(--red);
    font-size: var(--fs-xl);
    font-weight: var(--fw-bold);
    letter-spacing: 0.5px;
  }
  input.hdr-input.auto-size {
    width: auto;
    min-width: 40px;
  }
  input.proprietor-input { min-width: 200px; }
  input.mobile-input { min-width: 120px; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  input.address-input {
    min-width: 260px;
    color: var(--blue);
    font-weight: var(--fw-semibold);
  }

  .signature-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
    padding-right: 30px;
  }
  .signature-area img {
    max-height: 80px;
    max-width: 180px;
  }

  @media (max-width: 860px) {
    .voucher { width: 100%; padding: 24px 18px 32px; }
    .company-input { font-size: 26px; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls button { width: 100%; }
  }
</style>
</head>
<body>

<div class="voucher" id="voucher">
  <div class="header">
    <div class="bismillah">বিসমিল্লাহির রাহমানির রাহিম</div>
    <div class="company-name"><input type="text" id="companyName" class="hdr-input company-input" value="মেসার্স অর্পা কনস্ট্রাকশন" title="কোম্পানির নাম" /></div>
    <div class="proprietor"><input type="text" id="proprietor" class="hdr-input proprietor-input auto-size" value="প্রোঃ মোঃ আরিফুল ইসলাম" title="প্রোপ্রাইটর" /></div>
    <div class="mobile">মোবাইল: <input type="text" id="mobile" class="hdr-input mobile-input auto-size" value="০১৭৩১৫০৯৪৮৩" title="মোবাইল নাম্বার" /></div>
    <div class="role-wrap">
      <input type="text" id="role" class="role hdr-input auto-size" value="ঠিকাদার ও সরবরাহকারী" title="পেশা" />
      <span class="role-underline" id="roleUnderline"></span>
    </div>
    <div class="desc"><input type="text" id="desc" class="desc-input hdr-input" value="আমরা সকল প্রকার বিল্ডিং নির্মান ও পুনঃনির্মান কাজ কন্ট্রাকের মাধ্যমে নির্ধারিত সময়ে দক্ষ জনবল দ্বারা সম্পন্ন করে থাকি।" title="বর্ণনা" /></div>
    <div class="address"><input type="text" id="address" class="hdr-input address-input auto-size" value="উত্তর আশরতপুর, তাজহাট, রংপুর।" title="ঠিকানা" /></div>
  </div>

  <hr class="divider" />

  <div class="meta-row">
    <div class="left">
      <input type="text" class="label label-input auto-size" value="সূত্র:" title="বাঁ লেবেল" />
      <input type="text" id="sutro" value="" title="সূত্র মান" />
    </div>
    <div class="right">
      <input type="text" class="label label-input auto-size" value="তারিখ:" title="ডান লেবেল" />
      <input type="text" id="tarikh" class="auto-size" title="তারিখ মান" />
    </div>
  </div>

  <div class="site-code-row">
    <input type="text" class="label label-input site-label-input auto-size" value="সাইট কোড:" title="সাইট কোড লেবেল" />
    <input type="text" id="siteCode" class="auto-size" value="FNSNG80" title="সাইট কোড মান" />
  </div>

  <div class="amounts">
    <table>
      <tr>
        <td class="lbl"><input type="text" class="lbl-input auto-size" value="সাইটের কাজের রেট :" title="রেট লেবেল" /></td>
        <td class="val"><input type="text" id="rate" value="১,২০,০০০/-" title="রেট মান" /></td>
      </tr>
      <tr>
        <td class="lbl"><input type="text" class="lbl-input auto-size" value="সাইট পেমেন্ট :" title="পেমেন্ট লেবেল" /></td>
        <td class="val"><input type="text" id="payment" value="১,০০,০০০/-" title="পেমেন্ট মান" /></td>
      </tr>
      <tr class="total-row">
        <td class="lbl"><input type="text" class="lbl-input auto-size" value="মোট পাওনা :" title="মোট পাওনা লেবেল" /></td>
        <td class="val"><input type="text" id="due" value="২০,০০০/-" title="মোট পাওনা মান" /></td>
      </tr>
    </table>
  </div>

  <div class="signature-area">
    <img id="signature" src="signature.png" alt="স্বাক্ষর" />
  </div>
</div>

<div class="controls">
  <label for="sigUpload">স্বাক্ষর পরিবর্তন (optional):</label>
  <input type="file" id="sigUpload" accept="image/*" />
  <button type="button" id="downloadPngBtn">⬇ Download PNG</button>
  <button type="button" id="downloadPdfBtn" class="secondary">⬇ Download PDF</button>
</div>

<script>
  // Bengali digit conversion
  const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  function toBengaliDigits(s) {
    return String(s).replace(/[0-9]/g, d => bnDigits[+d]);
  }

  // Set current date in dd/mm/yyyy Bengali
  (function setToday() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    document.getElementById('tarikh').value = toBengaliDigits(`${dd}/${mm}/${yyyy}`);
  })();

  // Auto-size inputs based on content (so border-bottom hugs the text)
  const sizer = document.createElement('span');
  sizer.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:-9999px;';
  document.body.appendChild(sizer);

  function autoSize(inp) {
    const cs = getComputedStyle(inp);
    sizer.style.font = cs.font;
    sizer.style.fontFamily = cs.fontFamily;
    sizer.style.fontSize = cs.fontSize;
    sizer.style.fontWeight = cs.fontWeight;
    sizer.style.letterSpacing = cs.letterSpacing;
    sizer.style.fontVariantNumeric = cs.fontVariantNumeric;
    sizer.textContent = inp.value || inp.placeholder || '';
    const minW = parseFloat(cs.minWidth) || 0;
    const w = Math.max(minW, sizer.offsetWidth + 4);
    inp.style.width = w + 'px';
  }

  function autoSizeAll() {
    document.querySelectorAll('.auto-size').forEach(autoSize);
  }
  function syncRoleUnderline() {
    const role = document.getElementById('role');
    const u = document.getElementById('roleUnderline');
    if (role && u) u.style.width = role.offsetWidth + 'px';
  }
  document.querySelectorAll('.auto-size').forEach(inp => {
    inp.addEventListener('input', () => {
      autoSize(inp);
      if (inp.id === 'role') syncRoleUnderline();
    });
  });
  autoSizeAll();
  syncRoleUnderline();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { autoSizeAll(); syncRoleUnderline(); });
  }

  // Signature upload
  document.getElementById('sigUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('signature').src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Render voucher to canvas at fixed desktop width (so mobile layouts also produce voucher-sized output)
  async function renderVoucher() {
    const node = document.getElementById('voucher');

    // Force desktop width during capture for consistent voucher size on any device
    const prevWidth = node.style.width;
    const prevMaxW = node.style.maxWidth;
    node.style.width = '820px';
    node.style.maxWidth = 'none';

    // Replace inputs with spans for cleaner text rendering.
    // Copy only safe text-rendering properties — NOT width (let span size to content).
    const inputs = node.querySelectorAll('input');
    const replacements = [];
    inputs.forEach(inp => {
      const span = document.createElement('span');
      span.textContent = inp.value;
      const cs = window.getComputedStyle(inp);
      span.style.display = 'inline-block';
      span.style.fontFamily = cs.fontFamily;
      span.style.fontSize = cs.fontSize;
      span.style.fontWeight = cs.fontWeight;
      span.style.fontStyle = cs.fontStyle;
      span.style.color = cs.color;
      span.style.letterSpacing = cs.letterSpacing;
      span.style.fontVariantNumeric = cs.fontVariantNumeric;
      span.style.lineHeight = cs.lineHeight;
      span.style.whiteSpace = 'pre';
      span.style.verticalAlign = 'baseline';
      // Match the input's box width so right-aligned amounts stay in the same column.
      span.style.width = inp.offsetWidth + 'px';
      span.style.textAlign = cs.textAlign;
      span.style.overflow = 'visible';
      inp.parentNode.insertBefore(span, inp);
      inp.style.display = 'none';
      replacements.push({ inp, span });
    });

    try {
      const canvas = await html2canvas(node, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        width: 820,
        windowWidth: 820
      });
      return canvas;
    } finally {
      replacements.forEach(({ inp, span }) => {
        inp.style.display = '';
        span.remove();
      });
      node.style.width = prevWidth;
      node.style.maxWidth = prevMaxW;
    }
  }

  function filename(ext) {
    const code = document.getElementById('siteCode').value || 'voucher';
    return `voucher_${code}.${ext}`;
  }

  async function withBusy(btn, label, fn) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = label;
    try {
      await fn();
    } catch (err) {
      alert('Download failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  document.getElementById('downloadPngBtn').addEventListener('click', (e) => {
    withBusy(e.currentTarget, 'Generating...', async () => {
      const canvas = await renderVoucher();
      const link = document.createElement('a');
      link.download = filename('png');
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  document.getElementById('downloadPdfBtn').addEventListener('click', (e) => {
    withBusy(e.currentTarget, 'Generating...', async () => {
      const canvas = await renderVoucher();
      const imgData = canvas.toDataURL('image/png');

      // PDF size = actual voucher size (no A4 padding). 96dpi → 1px = 0.2645mm
      // Canvas rendered at scale:2 of 820px width; divide by 2 to get CSS px then × 0.2645.
      const cssPxToMm = 25.4 / 96;
      const widthMm = (canvas.width / 2) * cssPxToMm;
      const heightMm = (canvas.height / 2) * cssPxToMm;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: widthMm > heightMm ? 'landscape' : 'portrait',
        unit: 'mm',
        format: [widthMm, heightMm]
      });
      pdf.addImage(imgData, 'PNG', 0, 0, widthMm, heightMm);
      pdf.save(filename('pdf'));
    });
  });
</script>

</body>
</html>
