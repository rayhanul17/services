<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>মেসার্স অর্পা কনস্ট্রাকশন - ভাউচার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --font: 'Hind Siliguri', system-ui, sans-serif;
    --red: #c62828;
    --blue: #1a4ba0;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #bdbdbd;
    --line-soft: #e0e0e0;

    --fs-xs: 13px;
    --fs-sm: 14px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;
    --fs-xl: 34px;

    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;
    --fw-bold: 700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    font-feature-settings: "kern" 1, "liga" 1;
  }

  body {
    background: #eef0f3;
    padding: 24px 16px;
    min-height: 100vh;
    font-size: var(--fs-base);
    line-height: 1.5;
  }

  input, button {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .controls {
    max-width: 820px;
    margin: 0 auto 20px;
    background: #fff;
    padding: 14px 18px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls label { font-weight: var(--fw-semibold); font-size: var(--fs-sm); color: var(--ink); }
  .controls input[type="file"] { font-size: var(--fs-sm); }
  .controls button {
    padding: 9px 20px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: var(--fw-semibold);
    font-size: var(--fs-sm);
    letter-spacing: 0.2px;
  }
  .controls button:hover { background: #a91d1d; }
  .controls button.secondary { background: #424242; }
  .controls button.secondary:hover { background: #2a2a2a; }

  .voucher {
    width: 820px;
    margin: 0 auto;
    background: #fff;
    padding: 36px 56px 44px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    color: var(--ink);
    font-size: var(--fs-base);
  }

  /* Header */
  .header { text-align: center; }
  .bismillah { font-size: var(--fs-base); font-weight: var(--fw-medium); margin-bottom: 6px; }
  .company-name {
    color: var(--red);
    font-size: var(--fs-xl);
    font-weight: var(--fw-bold);
    letter-spacing: 0.5px;
    line-height: 1.2;
    margin: 4px 0 8px;
  }
  .proprietor {
    display: inline-block;
    border: 1.5px solid var(--red);
    border-radius: 999px;
    padding: 5px 24px;
    font-size: var(--fs-base);
    font-weight: var(--fw-medium);
    margin: 4px 0 8px;
  }
  .mobile { font-size: var(--fs-base); font-weight: var(--fw-medium); margin-top: 4px; }
  .role {
    color: var(--red);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1.5px;
    margin-top: 10px;
  }
  .desc {
    font-size: var(--fs-sm);
    font-weight: var(--fw-regular);
    margin-top: 8px;
    color: var(--ink);
  }
  .address {
    color: var(--blue);
    font-size: var(--fs-base);
    font-weight: var(--fw-semibold);
    margin-top: 6px;
  }

  .divider {
    border: none;
    border-top: 1.5px solid #333;
    margin: 18px 0;
  }

  /* Meta */
  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: var(--fs-base);
    margin-bottom: 20px;
  }
  .meta-row .label { color: var(--muted); margin-right: 8px; font-weight: var(--fw-medium); }
  .meta-row input {
    border: none;
    border-bottom: 1px dashed var(--line-soft);
    font-size: var(--fs-base);
    background: transparent;
    outline: none;
    width: 170px;
    color: var(--ink);
    padding: 2px 0;
  }
  .meta-row input:focus { border-bottom-color: var(--muted); }
  .meta-row .right input { text-align: right; }

  .site-code-row {
    margin-bottom: 48px;
    font-size: var(--fs-md);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .site-code-row .label {
    color: var(--red);
    font-weight: var(--fw-bold);
  }
  .site-code-row input {
    border: none;
    border-bottom: 1px dashed var(--line-soft);
    font-size: var(--fs-md);
    font-weight: var(--fw-semibold);
    background: transparent;
    outline: none;
    width: 220px;
    color: var(--ink);
    padding: 2px 0;
    letter-spacing: 0.5px;
  }
  .site-code-row input:focus { border-bottom-color: var(--muted); }

  /* Amounts */
  .amounts {
    display: flex;
    justify-content: center;
    margin: 32px 0 24px;
  }
  .amounts table {
    border-collapse: collapse;
    font-size: var(--fs-md);
  }
  .amounts td {
    padding: 8px 16px;
    vertical-align: middle;
  }
  .amounts td.lbl {
    text-align: right;
    font-weight: var(--fw-medium);
    color: var(--ink);
  }
  .amounts td.val {
    text-align: right;
    min-width: 150px;
  }
  .amounts input {
    border: none;
    border-bottom: 1px dashed transparent;
    background: transparent;
    font-size: var(--fs-md);
    font-weight: var(--fw-medium);
    text-align: right;
    width: 140px;
    outline: none;
    color: var(--ink);
    padding: 2px 0;
  }
  .amounts input:focus { border-bottom-color: var(--muted); }
  .amounts tr.total-row td {
    border-top: 1.5px solid #000;
    padding-top: 12px;
    font-weight: var(--fw-semibold);
  }
  .amounts tr.total-row input { font-weight: var(--fw-semibold); }

  /* Header inputs (editable text inside header) */
  .hdr-input {
    border: none;
    border-bottom: 1px dashed transparent;
    background: transparent;
    text-align: center;
    outline: none;
    color: inherit;
    font-weight: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    padding: 0;
  }
  .hdr-input:focus { border-bottom-color: var(--muted); }
  .company-input {
    width: 100%;
    max-width: 620px;
    color: var(--red);
    font-size: var(--fs-xl);
    font-weight: var(--fw-bold);
    letter-spacing: 0.5px;
  }
  .proprietor-input { width: 300px; }
  .mobile-input { width: 160px; }
  .address-input {
    width: 400px;
    color: var(--blue);
    font-weight: var(--fw-semibold);
  }

  .signature-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
    padding-right: 30px;
  }
  .signature-area img {
    max-height: 80px;
    max-width: 180px;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .controls { display: none; }
    .voucher { box-shadow: none; border: none; }
  }
</style>
</head>
<body>

<div class="controls">
  <label for="sigUpload">স্বাক্ষর পরিবর্তন (optional):</label>
  <input type="file" id="sigUpload" accept="image/*" />
  <button type="button" id="downloadBtn">⬇ Download Voucher (PNG)</button>
  <button type="button" class="secondary" onclick="window.print()">🖨 Print</button>
</div>

<div class="voucher" id="voucher">
  <div class="header">
    <div class="bismillah">বিসমিল্লাহির রাহমানির রাহিম</div>
    <div class="company-name"><input type="text" id="companyName" class="hdr-input company-input" value="মেসার্স অর্পা কনস্ট্রাকশন" title="কোম্পানির নাম" /></div>
    <div class="proprietor"><input type="text" id="proprietor" class="hdr-input proprietor-input" value="প্রোঃ মোঃ আরিফুল ইসলাম" title="প্রোপ্রাইটর" /></div>
    <div class="mobile">মোবাইল নং: <input type="text" id="mobile" class="hdr-input mobile-input" value="০১৭৩১৫০৯৪৮৩" title="মোবাইল নাম্বার" /></div>
    <div class="role">ঠিকাদার ও সরবরাহকারী</div>
    <div class="desc">আমরা সকল প্রকার বিল্ডিং নির্মান ও পুনঃনির্মান কাজ কন্ট্রাকের মাধ্যমে নির্ধারিত সময়ে দক্ষ জনবল দ্বারা সম্পন্ন করে থাকি।</div>
    <div class="address"><input type="text" id="address" class="hdr-input address-input" value="উত্তর আশরতপুর, তাজহাট, রংপুর।" title="ঠিকানা" /></div>
  </div>

  <hr class="divider" />

  <div class="meta-row">
    <div class="left">
      <span class="label">সূত্র:</span>
      <input type="text" id="sutro" value="" />
    </div>
    <div class="right">
      <span class="label">তারিখ:</span>
      <input type="text" id="tarikh" />
    </div>
  </div>

  <div class="site-code-row">
    <span class="label">সাইট কোড:</span>
    <input type="text" id="siteCode" value="FNSNG80" />
  </div>

  <div class="amounts">
    <table>
      <tr>
        <td class="lbl">সাইটের কাজের রেট :</td>
        <td class="val"><input type="text" id="rate" value="১,২০,০০০/-" /></td>
      </tr>
      <tr>
        <td class="lbl">সাইট পেমেন্ট :</td>
        <td class="val"><input type="text" id="payment" value="১,০০,০০০/-" /></td>
      </tr>
      <tr class="total-row">
        <td class="lbl">মোট পাওনা :</td>
        <td class="val"><input type="text" id="due" value="২০,০০০/-" /></td>
      </tr>
    </table>
  </div>

  <div class="signature-area">
    <img id="signature" src="signature.png" alt="স্বাক্ষর" />
  </div>
</div>

<script>
  // Bengali digit conversion
  const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
  function toBengaliDigits(s) {
    return String(s).replace(/[0-9]/g, d => bnDigits[+d]);
  }

  // Set current date in dd/mm/yyyy Bengali
  (function setToday() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    document.getElementById('tarikh').value = toBengaliDigits(`${dd}/${mm}/${yyyy}`);
  })();

  // Signature upload
  document.getElementById('sigUpload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('signature').src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Download as PNG
  document.getElementById('downloadBtn').addEventListener('click', async () => {
    const node = document.getElementById('voucher');
    const btn = document.getElementById('downloadBtn');
    btn.disabled = true;
    btn.textContent = 'Generating...';
    try {
      // Replace inputs with spans temporarily for cleaner rendering
      const inputs = node.querySelectorAll('input');
      const replacements = [];
      inputs.forEach(inp => {
        const span = document.createElement('span');
        span.textContent = inp.value;
        span.style.cssText = window.getComputedStyle(inp).cssText;
        span.style.borderBottom = 'none';
        span.style.display = 'inline-block';
        span.style.width = inp.offsetWidth + 'px';
        span.style.textAlign = inp.style.textAlign || getComputedStyle(inp).textAlign;
        inp.parentNode.insertBefore(span, inp);
        inp.style.display = 'none';
        replacements.push({ inp, span });
      });

      const canvas = await html2canvas(node, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff'
      });

      // Restore inputs
      replacements.forEach(({ inp, span }) => {
        inp.style.display = '';
        span.remove();
      });

      const link = document.createElement('a');
      const siteCode = document.getElementById('siteCode').value || 'voucher';
      link.download = `voucher_${siteCode}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      alert('Download failed: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '⬇ Download Voucher (PNG)';
    }
  });
</script>

</body>
</html>
